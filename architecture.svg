<svg width="1300" height="610" viewBox="0 0 1300 610" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8078"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f2703c"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1815"/>
      <stop offset="1" stop-color="#14110f"/>
    </linearGradient>
  </defs>

  <rect width="1300" height="610" fill="url(#bg2)"/>

  <text x="40" y="40" fill="#f4ede6" font-size="24" font-weight="800">Do clique no painel até o CPE — e de volta</text>
  <text x="40" y="64" fill="#8a8078" font-size="13">Uma ação (sincronizar, reiniciar, trocar Wi-Fi) passa sempre pelo mesmo orquestrador, não importa o fabricante do equipamento</text>

  <!-- Cron -->
  <rect x="275" y="90" width="260" height="42" rx="10" fill="#201c19" stroke="#3a332c" stroke-dasharray="4 3"/>
  <text x="405" y="116" fill="#a89e93" font-size="12" text-anchor="middle">Cron jobs (sync em massa, quarentena)</text>
  <path d="M405,132 L405,160" fill="none" stroke="#8a8078" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Browser -->
  <rect x="40" y="165" width="180" height="60" rx="10" fill="#241f1a" stroke="#3a332c"/>
  <text x="130" y="190" fill="#f4ede6" font-size="14" text-anchor="middle" font-weight="700">Operador (painel)</text>
  <text x="130" y="208" fill="#8a8078" font-size="10" text-anchor="middle">clica "sincronizar" / "reiniciar"</text>

  <path d="M220,195 L270,195" fill="none" stroke="#f2703c" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Orquestrador -->
  <rect x="275" y="160" width="260" height="70" rx="14" fill="#3a2214" stroke="#f2703c" stroke-width="1.5"/>
  <text x="405" y="189" fill="#ffb08a" font-size="16" text-anchor="middle" font-weight="800">Orquestrador</text>
  <text x="405" y="209" fill="#e0b8a4" font-size="10" text-anchor="middle">recebe device + ação, comanda o resto do fluxo</text>

  <path d="M535,195 L585,195" fill="none" stroke="#f2703c" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Discovery -->
  <rect x="590" y="160" width="220" height="70" rx="12" fill="#241f1a" stroke="#3a332c"/>
  <text x="700" y="186" fill="#f4ede6" font-size="13" text-anchor="middle" font-weight="700">Identifica o dispositivo</text>
  <text x="700" y="203" fill="#8a8078" font-size="10" text-anchor="middle">resolve fabricante + modelo real</text>
  <text x="700" y="218" fill="#8a8078" font-size="10" text-anchor="middle">a partir do ID bruto do CPE</text>

  <path d="M810,195 L860,195" fill="none" stroke="#f2703c" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- Perfil -->
  <rect x="865" y="160" width="220" height="70" rx="12" fill="#241f1a" stroke="#3a332c"/>
  <text x="975" y="186" fill="#f4ede6" font-size="13" text-anchor="middle" font-weight="700">Carrega o perfil do modelo</text>
  <text x="975" y="203" fill="#8a8078" font-size="10" text-anchor="middle">mapa de parâmetros e ações</text>
  <text x="975" y="218" fill="#8a8078" font-size="10" text-anchor="middle">suportadas daquele fabricante</text>

  <path d="M975,230 L975,268" fill="none" stroke="#f2703c" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- GenieACS -->
  <rect x="820" y="268" width="310" height="70" rx="12" fill="#1c231f" stroke="#33b17a" stroke-width="1.5"/>
  <text x="975" y="297" fill="#7be3ae" font-size="14" text-anchor="middle" font-weight="800">GenieACS (TR-069/CWMP)</text>
  <text x="975" y="316" fill="#8fae9d" font-size="10" text-anchor="middle">envia o comando de verdade pro roteador do cliente</text>

  <path d="M975,338 L975,373" fill="none" stroke="#33b17a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CPE -->
  <rect x="875" y="373" width="200" height="56" rx="10" fill="#16201a" stroke="#2c4a3a"/>
  <text x="975" y="396" fill="#a6f0c6" font-size="13" text-anchor="middle" font-weight="700">CPE do cliente</text>
  <text x="975" y="413" fill="#6b8a78" font-size="10" text-anchor="middle">ONT / roteador</text>

  <!-- retorno -->
  <path d="M865,403 C700,403 700,353 700,338" fill="none" stroke="#8a8078" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="740" y="383" fill="#8a8078" font-size="10">responde / confirma</text>

  <path d="M590,210 L405,230" fill="none" stroke="#8a8078" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Update DB -->
  <rect x="130" y="268" width="240" height="70" rx="12" fill="#241f1a" stroke="#3a332c"/>
  <text x="250" y="294" fill="#f4ede6" font-size="13" text-anchor="middle" font-weight="700">Atualiza o espelho local</text>
  <text x="250" y="311" fill="#8a8078" font-size="10" text-anchor="middle">status online, sinal, IP, Wi-Fi</text>
  <text x="250" y="326" fill="#8a8078" font-size="10" text-anchor="middle">— MySQL, sem bater no Genie de novo</text>

  <path d="M370,195 L370,230 L250,230 L250,268" fill="none" stroke="#8a8078" stroke-dasharray="4 3"/>
  <path d="M130,303 L60,303" fill="none" stroke="#8a8078" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="95" y="293" fill="#8a8078" font-size="9" text-anchor="middle">painel</text>
  <text x="95" y="323" fill="#8a8078" font-size="9" text-anchor="middle">lê daqui</text>

  <!-- Perfis por fabricante -->
  <rect x="30" y="470" width="1240" height="110" rx="14" fill="#1a1613" stroke="#3a332c" stroke-dasharray="5 4"/>
  <text x="650" y="498" fill="#c9beb3" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">UM PERFIL DECLARATIVO POR FABRICANTE+MODELO — SEM TOCAR NO NÚCLEO DO SISTEMA</text>

  <g font-size="11" fill="#a89e93">
    <rect x="60" y="515" width="270" height="50" rx="8" fill="#211c19" stroke="#3a332c"/>
    <text x="195" y="535" text-anchor="middle" fill="#dcd3c8" font-weight="700">Regra de descoberta</text>
    <text x="195" y="552" text-anchor="middle">como reconhecer esse modelo</text>

    <rect x="350" y="515" width="270" height="50" rx="8" fill="#211c19" stroke="#3a332c"/>
    <text x="485" y="535" text-anchor="middle" fill="#dcd3c8" font-weight="700">Mapa de parâmetros</text>
    <text x="485" y="552" text-anchor="middle">onde fica cada dado (sinal, Wi-Fi, WAN)</text>

    <rect x="640" y="515" width="270" height="50" rx="8" fill="#211c19" stroke="#3a332c"/>
    <text x="775" y="535" text-anchor="middle" fill="#dcd3c8" font-weight="700">Ações suportadas</text>
    <text x="775" y="552" text-anchor="middle">o que esse modelo sabe fazer</text>

    <rect x="930" y="515" width="270" height="50" rx="8" fill="#211c19" stroke="#3a332c"/>
    <text x="1065" y="535" text-anchor="middle" fill="#dcd3c8" font-weight="700">Novo modelo = novo perfil</text>
    <text x="1065" y="552" text-anchor="middle">nunca precisa mexer no core</text>
  </g>
</svg>
